<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="计算机突围出品。覆盖准大一到大四、研一到研三的 CS 全周期学习导航：每阶段该学什么、方向怎么选、坑怎么避，支持目标筛选与双非专属模式。">
<meta property="og:title" content="计算机突围 · CS全周期导航">
<meta property="og:description" content="覆盖准大一到研三的 CS 全周期学习导航：每阶段该学什么、方向怎么选、坑怎么避，支持目标筛选与双非专属模式。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<title>计算机突围 · CS全周期导航</title>
<style>
:root {
  --bg: #f8f6f3; --card: #fff; --card2: #f1eeeb;
  --text: #2d2a27; --text2: #8a8682; --text3: #b8b4b0;
  --border: #e8e4e0; --accent: #e07c3c; --accent2: #f5a623;
  --shadow: 0 2px 12px rgba(45,42,39,.06);
  --radius: 14px;
  --foundation: #4a90d9; --core: #3aa67a; --skill: #8b6ccf;
  --competition: #e88a3a; --career: #d96a8a; --education: #3aa8c4;
  --project: #d4a832; --softskill: #c8922a; --industry: #7a5ccf; --faq: #c95a8a;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font: inherit; }

/* ===== APP SHELL ===== */
.app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }

/* ===== HEADER ===== */
.header { flex-shrink: 0; background: var(--card); padding: 12px 16px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.header h1 { font-size: 17px; font-weight: 700; flex: 1; }
.header h1 span { color: var(--accent); }
.header .subtitle { font-size: 11px; color: var(--text2); font-weight: 400; margin-left: 4px; }
.header-btn { font-size: 12px; width: 36px; height: 36px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ===== TAB CONTENT ===== */
.tab-panel { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.tab-panel.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 80px; }

/* ===== HOME ===== */
.hero-prompt { text-align: center; padding: 24px 0 16px; }
.hero-question { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.hero-sub { font-size: 13px; color: var(--text2); line-height: 1.5; }
.home-divider { height: 1px; background: var(--border); margin: 4px 0 16px; }
.quick-section { margin-bottom: 16px; }
.quick-section-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; letter-spacing: .3px; }
.stage-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stage-grid-btn { background: var(--card); border-radius: 12px; padding: 16px 6px; text-align: center; box-shadow: var(--shadow); transition: all .15s; cursor: pointer; border: 1.5px solid transparent; }
.stage-grid-btn.active { border-color: var(--accent); background: #fdf6ee; }
.stage-grid-btn:active { transform: scale(.95); }
.stage-grid-btn .emoji { font-size: 26px; display: block; margin-bottom: 4px; }
.stage-grid-btn .label { font-size: 13px; font-weight: 600; }
.stage-grid-btn .sub { font-size: 10px; color: var(--text2); margin-top: 2px; }

/* ===== DISCLAIMER ===== */
.disclaimer { background: #fdf6ee; border: 1px solid #f0e2d0; border-radius: 10px; padding: 10px 12px; margin: 4px 0 16px; display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: #8a6a3a; line-height: 1.6; }
.disclaimer .icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.disclaimer .close { margin-left: auto; flex-shrink: 0; font-size: 14px; color: #b8a080; cursor: pointer; padding: 2px; line-height: 1; }
.disclaimer.hidden { display: none; }



.identity-list { display: flex; flex-direction: column; gap: 6px; }
.identity-btn { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; transition: all .15s; border: 1.5px solid transparent; }
.identity-btn:active { transform: scale(.98); }
.identity-btn.active { border-color: var(--accent); background: #fdf6ee; }
.identity-btn .emoji { font-size: 20px; }
.identity-btn .info { flex: 1; }
.identity-btn .info .title { font-size: 13px; font-weight: 500; }
.identity-btn .info .desc { font-size: 11px; color: var(--text2); margin-top: 1px; }
.identity-btn .arrow { color: var(--text3); font-size: 14px; }

.hot-list { display: flex; flex-direction: column; gap: 6px; }
.hot-item { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; transition: all .15s; }
.hot-item:active { transform: scale(.98); }
.hot-item .num { width: 20px; height: 20px; border-radius: 6px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text2); flex-shrink: 0; }
.hot-item .num.top3 { background: var(--accent); color: #fff; }
.hot-item .text { flex: 1; font-size: 13px; }
.hot-item .tag { font-size: 10px; color: var(--accent); background: rgba(224,124,60,.1); padding: 1px 6px; border-radius: 4px; }

/* ===== STAGE TAB ===== */
.stage-nav { flex-shrink: 0; background: var(--card); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; align-items: center; }
.stage-nav::-webkit-scrollbar { display: none; }
.stage-nav-btn { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: 13px; background: var(--card2); color: var(--text2); white-space: nowrap; transition: all .2s; border: 1.5px solid transparent; }
.goal-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 8px 0 4px; }
.goal-chip { flex-shrink: 0; padding: 5px 12px; border-radius: 14px; font-size: 12px; background: var(--card2); color: var(--text2); white-space: nowrap; border: 1.5px solid transparent; cursor: pointer; transition: all .15s; }
.goal-chip.active { background: #eef4ff; color: #3a6ed9; border-color: #b8cff0; }
.goal-note { font-size: 11px; color: var(--text3); margin: 2px 0 10px; line-height: 1.6; }
.stage-nav-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.stage-nav-btn .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }
.shuangfei-badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; background: #fdf6ee; border: 1.5px solid #e8d5b8; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #a07030; cursor: pointer; user-select: none; white-space: nowrap; }
.shuangfei-badge:active { opacity: .7; }
.stage-nav-btn .dot.active-dot { background: currentColor; }

/* Stage content sections */
.stage-section { margin-bottom: 14px; }
.stage-section-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.stage-section-header .icon { font-size: 16px; }
.stage-section-header .stitle { font-size: 14px; font-weight: 600; }
.stage-section-header .more { font-size: 11px; color: var(--accent); margin-left: auto; }

.mission-card { background: linear-gradient(135deg, #fdf6ee, #fef9f3); border: 1px solid #f0e2d0; border-radius: var(--radius); padding: 14px; }
.mission-card .mtext { font-size: 14px; line-height: 1.7; color: #5a4a3a; }

.course-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.course-chip { background: var(--card); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); text-align: center; font-size: 12px; font-weight: 500; }
.course-chip .sub { font-size: 10px; color: var(--text2); font-weight: 400; }

.trap-card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 6px; border-left: 3px solid #e07c3c; }
.trap-card .ttitle { font-size: 13px; font-weight: 500; }
.trap-card .tdetail { font-size: 11px; color: var(--text2); line-height: 1.5; margin-top: 4px; }
.trap-card .tarrow { font-size: 11px; color: var(--text2); display: inline-block; }

.stage-faq-item { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 6px; cursor: pointer; }
.stage-faq-item:active { opacity: .7; }
.stage-faq-item .q { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.stage-faq-item .q .arrow { margin-left: auto; transition: transform .2s; color: var(--text3); }
.stage-faq-item.expanded .q .arrow { transform: rotate(180deg); }
.stage-faq-item .a { max-height: 0; overflow: hidden; transition: max-height .25s; font-size: 12px; color: var(--text2); line-height: 1.7; }
.stage-faq-item.expanded .a { max-height: 300px; padding-top: 8px; }

/* ===== ROUTES TAB ===== */
.route-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
.route-hd { padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.route-hd:active { background: var(--card2); }
.route-hd .remoji { font-size: 22px; }
.route-hd .rname { flex: 1; font-size: 15px; font-weight: 600; }
.route-hd .rarrow { transition: transform .2s; color: var(--text3); }
.route-card.expanded .rarrow { transform: rotate(180deg); }
.route-risk { padding: 0 14px 8px; font-size: 12px; color: #b85a2a; line-height: 1.5; }
.route-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.route-card.expanded .route-body { max-height: 600px; }
.route-step { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13px; }
.route-step .snum { color: var(--accent); font-weight: 600; margin-bottom: 2px; }
.route-step .sbody { color: var(--text2); line-height: 1.6; }

/* ===== SEARCH TAB ===== */
.search-box { flex-shrink: 0; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
.search-box input { width: 100%; padding: 10px 14px; border-radius: 24px; border: 1.5px solid var(--border); background: var(--bg); font-size: 14px; outline: none; transition: border-color .2s; }
.search-box input:focus { border-color: var(--accent); }
.search-cats { flex-shrink: 0; display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.search-cats::-webkit-scrollbar { display: none; }
.search-cat { flex-shrink: 0; padding: 4px 10px; border-radius: 12px; font-size: 11px; background: var(--card2); color: var(--text2); white-space: nowrap; border: 1px solid transparent; }
.search-cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.search-results { flex: 1; overflow-y: auto; padding: 8px 16px 80px; }
.search-empty { text-align: center; padding: 40px 0; color: var(--text2); font-size: 13px; }
.search-empty .big { font-size: 40px; margin-bottom: 12px; }
.search-result-item { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 6px; cursor: pointer; }
.search-result-item:active { transform: scale(.98); }
.search-result-item .srl { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.search-result-item .srd { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
.search-result-item .srt { font-size: 10px; color: var(--accent); margin-top: 4px; }

/* ===== DETAIL MODAL ===== */
.modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.3); display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 18px 18px 0 0; width: 100%; max-width: 480px; max-height: 75vh; overflow-y: auto; padding: 0 0 20px; animation: slideUp .25s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto; }
.modal-body { padding: 0 16px; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.modal-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 10px; }
.modal-desc { font-size: 13px; color: var(--text2); line-height: 1.8; margin-bottom: 14px; }
.modal-children { margin-top: 10px; }
.modal-children-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.modal-child { padding: 6px 0; border-bottom: 1px solid var(--border); border-radius: 8px; transition: background .15s; }
.modal-child.node-link { cursor: pointer; }
.modal-child.node-link:hover { background: var(--card2); }
.modal-child.tpl .mc-label { color: var(--text2); }
.modal-child:last-child { border-bottom: none; }
.modal-child .mc-label { font-size: 12px; color: var(--text1); font-weight: 500; }
.modal-child .mc-desc { font-size: 11px; color: var(--text2); margin-top: 2px; line-height: 1.5; }
.modal-marker { background: #fdf6ee; border: 1px solid #f0e2d0; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #8a6a3a; margin-bottom: 12px; }
.modal-star { display: block; margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: linear-gradient(135deg, #ffb64d, #ff8f3c); color: #fff; font-size: 13px; font-weight: 600; text-align: center; text-decoration: none; box-shadow: 0 2px 8px rgba(255,143,60,.3); }
.modal-star:active { transform: scale(.98); }

/* ===== BOTTOM NAV ===== */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
.bottom-nav button { flex: 1; padding: 6px 0 8px; font-size: 10px; color: var(--text3); text-align: center; transition: color .15s; }
.bottom-nav button.active { color: var(--accent); }
.bottom-nav .nicon { display: block; font-size: 20px; margin-bottom: 0; }

/* ===== LOADING ===== */
.loading { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--text2); font-size: 13px; flex-direction: column; gap: 10px; }
.spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (min-width: 480px) {
  .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <h1>计算机突围 <span class="subtitle">CS全周期导航</span></h1>
    <button class="header-btn" id="bookmarkBtn" title="收藏">🔖</button>
  </div>

  <!-- HOME TAB -->
  <div class="tab-panel active" id="tabHome">
    <div class="scroll-area">
      <div class="hero-prompt">
        <div class="hero-question">你处于哪个阶段？</div>
        <div class="hero-sub">选一个，告诉你这个阶段该做什么、怎么选、怎么避坑</div>

      <div class="disclaimer" id="disclaimer">
        <span class="icon">🛠️</span>
        <span>此导航尚在不断完善中，部分内容可能存在遗漏或不准确之处，仅供参考。如有建议欢迎在公众号后台留言反馈。</span>
        <span class="close" id="disclaimerClose">✕</span>

      <div class="stage-grid" id="homeStageGrid"></div>

      <div class="home-divider"></div>

      </div>

      <div class="quick-section">
        <div class="quick-section-title">🔥 热门必看</div>
        <div class="hot-list" id="hotList"></div>
      </div>
    </div>
  </div>

  <!-- STAGE TAB -->
  <div class="tab-panel" id="tabStage">
    <div class="stage-nav" id="stageNav"></div>
    <div class="scroll-area" id="stageContent"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- ROUTES TAB -->
  <div class="tab-panel" id="tabRoutes">
    <div class="scroll-area" id="routesContent"><div class="loading"><div class="spinner"></div></div></div>
  </div>

  <!-- SEARCH TAB -->
  <div class="tab-panel" id="tabSearch">
    <div class="search-box"><input type="text" id="searchInput" placeholder="搜索课程、问题、路线..." autocomplete="off"></div>
    <div class="search-cats" id="searchCats"></div>
    <div class="search-results" id="searchResults">
      <div class="search-empty"><div class="big">🔍</div>输入关键词搜索<br><span style="font-size:11px;color:var(--text3)">试试"考研还是就业"、"高数"、"双非"</span></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="active" data-tab="tabHome"><span class="nicon">🏠</span>首页</button>
    <button data-tab="tabStage"><span class="nicon">📅</span>阶段</button>
    <button data-tab="tabRoutes"><span class="nicon">🗺️</span>路线</button>
    <button data-tab="tabSearch"><span class="nicon">🔍</span>搜索</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

}

const CAT = {

// 知识星球引流：label → 星球链接（无链接节点不渲染按钮；短链由运营提供）

};

const TRAPS = {

function renderStageContent() {
  const el = document.getElementById('stageContent');
  const stage = state.stage;
  const sname = stageName(stage);

  // Root nodes for this stage
  let nodes = DATA.nodes.filter(n => !n.parent && n.category !== 'faq' && n.stage === stage);

  // FAQ for this stage
  let faqs = DATA.nodes.filter(n => n.category === 'faq' && !n.parent && n.stage === stage);

  // Traps for this stage (if any)
  const traps = TRAPS[stage] || [];

  // 双非 mode: only show marker nodes
  if (state.shuangfeiMode) {
    nodes = nodes.filter(n => n.marker);
    faqs = faqs.filter(n => n.marker);
  }

  const allCount = nodes.length;
  // 目标筛选: category whitelist
  if (state.goal && GOALS[state.goal]) {
    nodes = nodes.filter(n => GOALS[state.goal].cats.includes(n.category));
  }

  // Build HTML
  let html = '';

  // Goal filter bar
  html += `<div class="goal-bar">
    <button class="goal-chip ${!state.goal?'active':''}" data-goal="">全部</button>
    ${Object.entries(GOALS).map(([k,g]) => `<button class="goal-chip ${state.goal===k?'active':''}" data-goal="${k}">${g.l}</button>`).join('')}
  </div>`;
  if (state.goal && GOALS[state.goal]) {
    html += `<div class="goal-note">已按「${GOALS[state.goal].l}」筛选：${allCount} 个节点中显示 ${nodes.length} 个相关节点（常见问题不限目标）</div>`;
  }

  // Mission (only in 双非 mode if there are nodes to show)
  html += `<div class="stage-section">
    <div class="stage-section-header"><span class="icon">🎯</span><span class="stitle">${state.shuangfeiMode ? sname+'·双非专属' : sname+'的核心任务'}</span></div>
    <div class="mission-card"><div class="mtext">${state.shuangfeiMode ? '双非学生重点关注以下📌标记内容，这些是竞争差异点：' : getMission(stage)}</div></div>
  </div>`;

  // Traps
  if (traps.length) {
    html += `<div class="stage-section">
      <div class="stage-section-header"><span class="icon">⚠️</span><span class="stitle">致命陷阱（必看）</span></div>
      ${traps.map(t => `
        <div class="trap-card">
          <div class="ttitle">🕳️ ${t.t}</div>
          <div class="tdetail">${t.d}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // Courses (grouped by category)
  const byCat = {};
  nodes.forEach(n => {
    if (!byCat[n.category]) byCat[n.category] = [];
    byCat[n.category].push(n);
  });

  // Show categories that have courses
  if (Object.keys(byCat).length) {
    html += `<div class="stage-section">
      <div class="stage-section-header"><span class="icon">📖</span><span class="stitle">${sname}课程与知识点</span></div>`;

    for (const [cat, items] of Object.entries(byCat)) {
      const ci = catInfo(cat);
      html += `<div style="margin-bottom:8px">
        <div style="font-size:12px;font-weight:600;color:${ci.c};margin-bottom:4px">${ci.e} ${ci.l}</div>
        <div class="course-grid">
          ${items.map(n => `
            <button class="course-chip" data-node="${n.id}">
              ${n.label}
              ${n.marker ? '<span style="font-size:10px;color:#e07c3c;display:block">📌双非</span>' : ''}
              <span class="sub">${n.description && n.description.length < 50 ? n.description : n.description.slice(0,40) + '…'}</span>
            </button>
          `).join('')}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // FAQ
  if (faqs.length) {
    html += `<div class="stage-section">
      <div class="stage-section-header"><span class="icon">❓</span><span class="stitle">常见问题</span></div>
      ${faqs.map(f => `
        <div class="stage-faq-item" data-node="${f.id}">
          <div class="q"><span>${f.label}</span>${f.marker?'<span style="font-size:10px;color:#e07c3c">📌</span>':''}<span class="arrow">▼</span></div>
          <div class="a">${f.description || '暂无详细说明'}</div>
        </div>
      `).join('')}
    </div>`;
  }

  // Empty state
  if (!traps.length && !Object.keys(byCat).length && !faqs.length) {
    html += `<div class="search-empty" style="padding:60px 0"><div class="big">📭</div><div>暂无数据</div></div>`;
  }

  el.innerHTML = html;
}

let searchData = [];

function buildSearchIndex() {
  searchData = [];
  // Add all nodes
  DATA.nodes.forEach(n => {
    const ci = catInfo(n.category);
    searchData.push({
      id: n.id,
      label: n.label,
      desc: n.description,
      category: n.category,
      stage: n.stage,
      catLabel: ci.l,
      catEmoji: ci.e,
      marker: n.marker,
      type: 'node',
    });
  });
  // Add traps
  for (const [stage, items] of Object.entries(TRAPS)) {
    items.forEach(t => {
      searchData.push({
        id: 'trap-'+stage+'-'+t.t,
        label: '🕳️ '+t.t,
        desc: t.d,
        category: 'faq',
        stage: stage,
        catLabel: '致命陷阱',
        catEmoji: '⚠️',
        marker: false,
        type: 'trap',
      });
    });
  }
  // Add routes
  ROUTES.forEach(r => {
    searchData.push({
      id: 'route-'+r.n,
      label: r.e+' '+r.n+'路线',
      desc: r.r + ' · ' + r.s.join(' → '),
      category: 'industry',
      stage: 'y2',
      catLabel: '学习路线',
      catEmoji: '🗺️',
      marker: false,
      type: 'route',
    });
  });
}

function doSearch(q) {
  q = q.toLowerCase().trim();
  const results = document.getElementById('searchResults');
  if (!q) {
    results.innerHTML = '<div class="search-empty"><div class="big">🔍</div>输入关键词搜索</div>';
    return;
  }

  let items = searchData.filter(d =>
    d.label.toLowerCase().includes(q) ||
    d.desc.toLowerCase().includes(q)
  );

  if (state.cat) items = items.filter(d => d.category === state.cat);

  // Prioritize by relevance
  items.sort((a, b) => {
    const aExact = a.label.toLowerCase().includes(q) ? 2 : a.desc.toLowerCase().includes(q) ? 1 : 0;
    const bExact = b.label.toLowerCase().includes(q) ? 2 : b.desc.toLowerCase().includes(q) ? 1 : 0;
    return bExact - aExact;
  });

  if (!items.length) {
    results.innerHTML = `<div class="search-empty"><div class="big">🔍</div>没有找到"${q}"相关的结果<br><span style="font-size:11px;color:var(--text3);">试试"考研"、"双非"、"高数"、"实习"</span></div>`;
    return;
  }

  results.innerHTML = items.slice(0, 30).map(d => `
    <div class="search-result-item" data-id="${d.id}" data-type="${d.type}" data-stage="${d.stage||''}">
      <div class="srl"><span>${d.label}</span><span style="font-size:10px;color:var(--text2);margin-left:auto">${d.catEmoji}${d.catLabel}</span></div>
      <div class="srd">${d.desc ? d.desc.slice(0, 80)+(d.desc.length>80?'...':'') : '暂无详情'}</div>
      ${d.marker ? '<div class="srt">📌 双非可关注</div>' : ''}
      <div class="srt" style="color:var(--text3)">${d.type === 'node' && STAGE_RANGE[d.label] ? STAGE_RANGE[d.label] + '（各校有差异）' : stageName(d.stage)}</div>
    </div>
  `).join('');
}

  const ci = catInfo(node.category);
  const children = getChildren(nodeId);

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-title">${ci.e} ${node.label}</div>
    <div class="modal-tag" style="background:${ci.c}15;color:${ci.c}">${ci.l} · ${stageNameOf(node)}</div>
    ${node.marker ? '<div class="modal-marker">📌 双非学生在此节点有差异化策略</div>' : ''}
    ${node.description ? `<div class="modal-desc">${node.description}</div>` : ''}
    ${children.length ? `<div class="modal-children"><div class="modal-children-title">包含 ${children.length} 项内容</div>
      ${children.map(c => `
        <div class="modal-child ${c.tpl ? 'tpl' : 'node-link'}" ${c.tpl ? '' : `data-node="${c.id}"`}>
          <div class="mc-label">· ${c.label}${c.marker ? ' 📌' : ''}</div>
          ${!c.tpl && c.description && c.description.length > 10 ? `<div class="mc-desc">${c.description.length > 60 ? c.description.slice(0,60) + '…' : c.description}</div>` : ''}
        </div>
      `).join('')}
    </div>` : ''}
    ${STARLINK[node.label] ? `<a class="modal-star" href="${STARLINK[node.label]}" target="_blank" rel="noopener">📮 想看更多深度内容与真实案例？来知识星球</a>` : ''}
  `;
  document.getElementById('modal').classList.add('show');
}

    switchTab(btn.dataset.tab);
  });

  // Home: stage grid
  document.getElementById('homeStageGrid').addEventListener('click', e => {
    const btn = e.target.closest('.stage-grid-btn');
    if (!btn) return;
    state.stage = btn.dataset.stage;
    switchTab('tabStage');
  });

  // Home: identity cards
  document.getElementById('identityList').addEventListener('click', e => {
    const btn = e.target.closest('.identity-btn');
    if (!btn) return;
    const focus = btn.dataset.focus;
    if (focus === 'routes') { switchTab('tabRoutes'); return; }
    if (focus === 'career') { state.stage = 'y3'; switchTab('tabStage'); return; }
    if (focus === 'education') { state.stage = 'y3'; switchTab('tabStage'); return; }
    if (focus === 'shuangfei') {
      state.shuangfeiMode = !state.shuangfeiMode;
      state.stage = state.shuangfeiMode ? 'y1' : 'y1';
      renderHome();
      if (state.shuangfeiMode) { switchTab('tabStage'); }
      else if (state.tab === 'tabStage') { renderStageNav(); renderStageContent(); }
    }
    if (focus === 'transfer') {
      state.stage = 'y1';
      switchTab('tabStage');
    }
  });

  // Home: hot items
  document.getElementById('hotList').addEventListener('click', e => {
    const item = e.target.closest('.hot-item');
    if (!item) return;
    const target = item.dataset.target;
    if (target === 'routes') { switchTab('tabRoutes'); return; }
    if (['y1','y2','y3','y4','m1'].includes(target)) {
      state.stage = target;
      switchTab('tabStage');
    }
  });

  // Stage nav
  document.getElementById('stageNav').addEventListener('click', e => {
    const badge = e.target.closest('.shuangfei-badge');
    if (badge) {
      state.shuangfeiMode = false;
      renderHome();
      renderStageNav();
      renderStageContent();
      return;
    }
    const btn = e.target.closest('.stage-nav-btn');
    if (!btn) return;
    state.stage = btn.dataset.stage;
    renderStageNav();
    renderStageContent();
  });

  // Stage: course chips → modal
  document.getElementById('stageContent').addEventListener('click', e => {
    const gbtn = e.target.closest('.goal-chip');
    if (gbtn) {
      state.goal = gbtn.dataset.goal || null;
      renderStageContent();
      return;
    }
    const chip = e.target.closest('.course-chip');
    if (chip && chip.dataset.node) { showNodeDetail(chip.dataset.node); return; }
    const faq = e.target.closest('.stage-faq-item');
    if (faq) {
      faq.classList.toggle('expanded');
      return;
    }
  });

  // Routes expand
  document.getElementById('routesContent').addEventListener('click', e => {
    const card = e.target.closest('.route-card');
    if (card) card.classList.toggle('expanded');
  });

  // Search
  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.search = e.target.value;
      doSearch(state.search);
    }, 150);
  });

  document.getElementById('searchCats').addEventListener('click', e => {
    const btn = e.target.closest('.search-cat');
    if (!btn) return;
    state.cat = btn.dataset.cat || null;
    renderSearchCats();
    if (state.search) doSearch(state.search);
  });

  document.getElementById('searchResults').addEventListener('click', e => {
    const item = e.target.closest('.search-result-item');
    if (!item) return;
    const id = item.dataset.id;
    const type = item.dataset.type;
    if (type === 'node' && id) {
      const nd = getNode(id);
      if (nd && nd.tpl) { state.stage = nd.stage; switchTab('tabStage'); return; }
      showNodeDetail(id);
    }
    else if (type === 'route') switchTab('tabRoutes');
    else if (type === 'trap') {
      const s = item.dataset.stage;
      if (s) { state.stage = s; switchTab('tabStage'); }
    }
  });

  // Modal close + child drill-down
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) {
      document.getElementById('modal').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
    }
  });
  document.getElementById('modalBody').addEventListener('click', e => {
    const child = e.target.closest('.modal-child');
    if (child && child.dataset.node) showNodeDetail(child.dataset.node);
  });

  // Bookmark
  document.getElementById('bookmarkBtn').addEventListener('click', () => {
    const u = window.location.href;
    navigator.clipboard.writeText(u).then(() => {
      const btn = document.getElementById('bookmarkBtn');
      btn.textContent = '✅';
      setTimeout(() => btn.textContent = '🔖', 2000);
    }).catch(() => alert('复制失败，请手动复制地址栏链接'));
  });
}

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));

  // Refresh content when switching to certain tabs
  if (tab === 'tabStage') {
    renderStageNav();
    renderStageContent();
  }
}

// ===== INIT =====
async function init() {
  await loadData();
  buildSearchIndex();
  document.getElementById('disclaimerClose').onclick = () => document.getElementById('disclaimer').classList.add('hidden');
  renderHome();
  renderStageNav();
  renderStageContent();
  renderRoutes();
  renderSearchCats();
  bindEvents();
}

init().catch(e => {
  document.getElementById('stageContent').innerHTML = '<div class="search-empty"><div class="big">❌</div>数据加载失败</div>';
  console.error(e);
});
</script>
</body>
</html>
